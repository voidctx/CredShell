<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #0d1117;
      color: #f0f6fc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .logo {
      font-size: 20px;
    }
    h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .online {
      background: rgba(46, 160, 67, 0.2);
      color: #3fb950;
      border: 1px solid rgba(46, 160, 67, 0.4);
    }
    .offline {
      background: rgba(248, 81, 73, 0.2);
      color: #f85149;
      border: 1px solid rgba(248, 81, 73, 0.4);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .online .dot { background: #3fb950; box-shadow: 0 0 6px #3fb950; }
    .offline .dot { background: #f85149; }
    p {
      font-size: 12px;
      color: #8b949e;
      line-height: 1.4;
      margin: 0 0 10px 0;
    }
    code {
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 4px;
      border-radius: 4px;
      font-family: monospace;
      color: #58a6ff;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">🔐</span>
    <h2>CredShell Passkey</h2>
  </div>

  <div id="status" class="status-badge offline">
    <span class="dot"></span>
    <span id="status-text">Checking listener...</span>
  </div>

  <p>Active listener: <code>http://127.0.0.1:5209</code></p>
  <p>When active, all browser WebAuthn requests (Passkeys) route to CredShell for user verification.</p>

  <script src="popup.js"></script>
</body>
</html>
